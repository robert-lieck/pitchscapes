name: doc

# Building the documentation runs all examples, which takes a while. It is therefore not triggered automatically
# but has to be started manually from the Actions tab ("Run workflow"). The documentation is only deployed when run
# on the main branch.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: generate doc
        run: |
          pip install -r requirements.txt
          pip install -r doc/requirements.txt
          cd doc/
          make html
          make linkcheck

      - name: Deploy doc
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./doc/_build/html

